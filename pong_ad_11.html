<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cat's Pong — Afterburner Arena</title><style>:root{color-scheme:dark;--cyan:#6fffe9;--orange:#ffad57}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 20%,#24365b,#070b18 70%);color:#f7f4ec;font-family:system-ui,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.poster{width:min(920px,100%);border:2px solid #657a9c;border-radius:22px;overflow:hidden;background:#10172b;box-shadow:0 25px 90px #000a;position:relative}.poster:before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent 0 4px,#0002 5px 6px);z-index:2}.top{display:flex;justify-content:space-between;gap:12px;padding:22px 30px;background:linear-gradient(90deg,#293f65,#1b2542);font-size:12px;letter-spacing:3px;color:#b4d7ff}header{text-align:center;padding:35px 18px 16px}h1{font-size:clamp(48px,10vw,104px);margin:0;line-height:1;letter-spacing:-5px;text-shadow:5px 5px 0 #172a4d;color:var(--cyan)}.sub{color:var(--orange);letter-spacing:7px;font-weight:900;margin:12px 0 0}.arena{position:relative;margin:20px auto 24px;width:90%;height:330px;border:3px solid #7b9db6;background:radial-gradient(ellipse at center,#1e3450,#070e1e);box-shadow:inset 0 0 45px #000b,0 0 30px #40d7e72b;overflow:hidden}.arena:after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:3px dashed #ffffff55}.score{position:absolute;top:15px;left:0;right:0;text-align:center;font:900 44px monospace;letter-spacing:18px;z-index:1}.paddle{position:absolute;width:12px;height:75px;border-radius:3px;box-shadow:0 0 22px currentColor}.left{left:30px;background:var(--cyan);color:var(--cyan)}.right{right:30px;background:var(--orange);color:var(--orange)}.ball{position:absolute;width:16px;height:16px;border-radius:50%;background:white;box-shadow:0 0 22px #fff,0 0 45px var(--cyan)}.bottom{text-align:center;padding:0 25px 30px}h2{font-size:clamp(20px,4vw,34px);margin:0 0 8px}.bottom p{color:#afc1d6}button{background:var(--orange);border:0;border-radius:8px;padding:15px 32px;font-weight:900;font-size:17px;cursor:pointer;color:#172037;box-shadow:0 6px 0 #a65e2c}button:active{transform:translateY(4px);box-shadow:0 2px 0 #a65e2c}footer{font-size:12px;letter-spacing:1px;color:#94a8bf;margin-top:23px}@media(max-width:600px){.arena{height:250px}.top{padding:15px;font-size:9px;letter-spacing:1px}h1{letter-spacing:-2px}.sub{letter-spacing:3px}}</style></head><body><main class="poster"><div class="top"><span>AC HOLDINGS // ARCADE DIVISION</span><span>TRANSMISSION 011</span></div><header><h1>CAT'S PONG</h1><p class="sub">AFTERBURNER ARENA</p></header><section class="arena" aria-label="Animated demonstration of Pong"><div class="score"><span id="s1">0</span> : <span id="s2">0</span></div><div class="paddle left" id="p1"></div><div class="paddle right" id="p2"></div><div class="ball" id="ball"></div></section><section class="bottom"><h2>THE NEXT RALLY STARTS NOW.</h2><p>Two paddles. One ball. Retro rivalry at full speed.</p><button id="toggle">START THE SHOW</button><footer>CAT'S PONG · © AC Kondo 1999–2026 · A fan-made promotional concept</footer></section></main><script>(()=>{const arena=document.querySelector('.arena'),p1=document.getElementById('p1'),p2=document.getElementById('p2'),ball=document.getElementById('ball'),btn=document.getElementById('toggle'),s1=document.getElementById('s1'),s2=document.getElementById('s2');let running=false,last=0,x=.5,y=.5,vx=.35,vy=.26,ly=.5,ry=.5,a=0,b=0;function frame(t){const dt=Math.min((t-last||16)/1000,.04);last=t;if(running){x+=vx*dt;y+=vy*dt;if(y<.04||y>.96){vy*=-1;y=Math.max(.04,Math.min(.96,y))}ly+=(y-ly)*Math.min(1,dt*3.2);ry+=(y-ry)*Math.min(1,dt*3.6);if(x<.065&&vx<0&&Math.abs(y-ly)<.16)vx=Math.abs(vx)*1.025;if(x>.935&&vx>0&&Math.abs(y-ry)<.16)vx=-Math.abs(vx)*1.025;if(x<0||x>1){if(x<0)b++;else a++;s1.textContent=a;s2.textContent=b;x=.5;y=.5;vx=(x<0?.35:-.35);vy=(Math.random()-.5)*.5}}const w=arena.clientWidth,h=arena.clientHeight;ball.style.left=(x*w-8)+'px';ball.style.top=(y*h-8)+'px';p1.style.top=(ly*h-37)+'px';p2.style.top=(ry*h-37)+'px';requestAnimationFrame(frame)}btn.addEventListener('click',()=>{running=!running;btn.textContent=running?'PAUSE THE SHOW':'RESUME THE RALLY'});requestAnimationFrame(frame)})();</script></body></html>
